php-version = "8.1"

[source]
paths = ["src/", "tests/", "cereal-images.php"]
excludes = []

[formatter]
print-width = 120
null-type-hint = "question"
space-before-arrow-function-parameter-list-parenthesis = true
space-after-logical-not-unary-prefix-operator = true
sort-uses = true

[linter]
integrations = []

[linter.rules]
literal-named-argument = { enabled = false }
no-else-clause = { enabled = true }
no-assign-in-condition = { enabled = false }
no-empty = { enabled = false }
no-global = { enabled = false }
no-literal-password = { enabled = false }
no-empty-comment = { enabled = false }
no-eval = { enabled = true }
no-multi-assignments = { enabled = false }
no-redundant-nullsafe = { enabled = false }
no-redundant-parentheses = { enabled = true }
no-redundant-use = { enabled = true }
no-shorthand-ternary = { enabled = false }
prefer-arrow-function = { enabled = false }
prefer-first-class-callable = { enabled = false }
prefer-static-closure = { enabled = false }
too-many-methods = { threshold = 20 }
# Seuils par classe relevés : découper une classe cohérente pour une métrique irait contre « pas de patterns pour le principe ».
# La complexité reste bornée méthode par méthode (method-threshold).
cyclomatic-complexity = { threshold = 40, method-threshold = 10 }
kan-defect = { enabled = false } # score par classe, redondant avec cyclomatic-complexity par méthode
